# TEMPORARY development aid - removed before the branch is finished.
#
# Packs the Flutter SDK cache and the pub cache this project resolves to and
# publishes them as unreferenced git blobs (see dev_carry.sh), so that a
# machine that can only reach api.github.com can format, analyse and test.
name: dev-toolchain

on:
  push:
    branches: ['arena/**']
    paths:
      - .github/workflows/dev-toolchain.yml
      - .github/scripts/dev_toolchain.sh

permissions:
  contents: write
  checks: write

defaults:
  run:
    shell: bash

jobs:
  pack:
    name: Pack toolchain (dev aid)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Pack and publish
        run: bash .github/scripts/dev_toolchain.sh
