name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The steps below run even when an earlier one failed, so that one run
      # reports everything that is wrong.
      - name: Generated Drift code is up to date
        if: ${{ !cancelled() }}
        run: |
          dart run build_runner build
          git diff --stat --exit-code -- lib/data/local_db/app_database.g.dart

      - name: Static analysis
        if: ${{ !cancelled() }}
        run: flutter analyze

      - name: Formatting
        if: ${{ !cancelled() }}
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v '\.g\.dart$')

      - name: Gate 1 - MathEngine (TC-01..TC-20), headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --plain-name "MathEngine" --reporter expanded

      - name: Gate 2 - all 24 verification cases, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --reporter expanded

      - name: Domain test-suite, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain --reporter expanded

      - name: Gate 3 - Flutter test-suite (notifier, isolate cancellation, widgets)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: flutter test --timeout 120s --reporter expanded

      - name: Render screenshots
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: CALC_SCREENSHOTS=1 flutter test test/screenshots --timeout 90s --reporter expanded

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/screenshots/*.png
          if-no-files-found: warn

  build-android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # With the repository secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
      # the release is signed with that key, otherwise with the debug key.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/release_keystore.sh

      # One APK per ABI (small downloads) and one universal APK that runs on
      # every device and on the x86_64 emulator of the smoke test.
      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # Fails when an APK is not properly signed; the run summary lists what
      # was built and who signed it.
      - name: Verify APK signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          {
            echo "### APKs"
            echo
            echo "| File | Bytes | SHA-256 | Signer (certificate SHA-256) |"
            echo "| --- | ---: | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "== $apk"
            certs="$("$apksigner" verify --min-sdk-version 24 --print-certs "$apk")"
            echo "$certs"
            signer="$(echo "$certs" | sed -n 's/^.*certificate DN: //p' | head -n 1)"
            digest="$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
            echo "| $(basename "$apk") | $(stat -c %s "$apk") | \`$(sha256sum "$apk" | cut -d' ' -f1)\` | $signer (\`${digest:0:16}…\`) |" >> "$GITHUB_STEP_SUMMARY"
          done
          sha256sum build/app/outputs/flutter-apk/*.apk

      # Every APK is an artifact of its own and is stored as it is, not inside
      # a zip, so that it can be downloaded straight onto a device. Such an
      # artifact is named after its file.
      - name: Upload app-arm64-v8a-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload app-armeabi-v7a-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload app-x86_64-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false
          if-no-files-found: error

  emulator-smoke:
    name: Emulator smoke test
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # An APK is a zip file itself and has to arrive unopened.
      - uses: actions/download-artifact@v8
        with:
          name: app-release.apk
          path: apk
          skip-decompress: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/emulator_smoke.sh apk/app-release.apk smoke

      - name: Upload emulator screenshots and logcat
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke
          path: smoke/
          if-no-files-found: warn
