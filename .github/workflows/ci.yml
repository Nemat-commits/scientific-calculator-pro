name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: write   # TEMPORARY (dev_carry.sh creates unreferenced blobs); back to `read` when finished
  checks: write     # TEMPORARY (dev_reports.sh)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: '3.50.0'
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?} kernel=$(uname -r) runner=${RUNNER_NAME:-?}" > "$RUNNER_TEMP/out/report-image-verify.txt"

      - name: Resolve dependencies
        run: flutter pub get 2>&1 | tee "$OUT/report-pubget.txt"

      - name: Generated Drift code is up to date
        if: ${{ !cancelled() }}
        run: |
          dart run build_runner build 2>&1 | tee "$OUT/report-buildrunner.txt"
          git diff --stat --exit-code -- lib/data/local_db/app_database.g.dart 2>&1 | tee -a "$OUT/report-buildrunner.txt"

      - name: Static analysis
        if: ${{ !cancelled() }}
        run: flutter analyze 2>&1 | tee "$OUT/report-analyze.txt"

      - name: Formatting
        if: ${{ !cancelled() }}
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -v '\.g\.dart$') 2>&1 | tee "$OUT/report-format.txt"

      - name: Gate 1 - MathEngine (TC-01..TC-20), headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --plain-name "MathEngine" --reporter expanded 2>&1 | tee "$OUT/report-gate1.txt"

      - name: Gate 2 - all 24 verification cases, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --reporter expanded 2>&1 | tee "$OUT/report-gate2.txt"

      - name: Domain test-suite, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain --reporter expanded 2>&1 | tee "$OUT/report-domain.txt"

      - name: Gate 3 - Flutter test-suite (notifier, isolate cancellation, widgets)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: flutter test --timeout 120s --reporter expanded 2>&1 | tee "$OUT/report-flutter-test.txt"

      - name: Render screenshots
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: CALC_SCREENSHOTS=1 flutter test test/screenshots --timeout 90s --reporter expanded 2>&1 | tee "$OUT/report-screenshots.txt"

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/screenshots/*.png
          if-no-files-found: warn

      # --- temporary development aids ---------------------------------------
      - name: Publish reports (dev aid)
        if: ${{ always() }}
        run: |
          bash .github/scripts/dev_reports.sh
          cd "$RUNNER_TEMP"
          [ -d "$GITHUB_WORKSPACE/build/screenshots" ] && tar -C "$GITHUB_WORKSPACE/build/screenshots" -cf shots.tar . || true
          bash "$GITHUB_WORKSPACE/.github/scripts/dev_carry.sh" verify shots.tar

  build-android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?} kernel=$(uname -r) runner=${RUNNER_NAME:-?}" > "$RUNNER_TEMP/out/report-image-apk.txt"

      - name: Resolve dependencies
        run: flutter pub get

      # With the repository secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
      # the release is signed with that key, otherwise with the debug key.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/release_keystore.sh

      # One APK per ABI (small downloads) and one universal APK that runs on
      # every device and on the x86_64 emulator of the smoke test.
      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi 2>&1 | tee "$OUT/report-apk.txt"
          flutter build apk --release 2>&1 | tee -a "$OUT/report-apk.txt"

      # Fails when an APK is not properly signed; the run summary lists what
      # was built and who signed it.
      - name: Verify APK signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          {
            echo "### APKs"
            echo
            echo "| File | Bytes | SHA-256 | Signer (certificate SHA-256) |"
            echo "| --- | ---: | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "== $apk"
            certs="$("$apksigner" verify --min-sdk-version 24 --print-certs "$apk")"
            echo "$certs"
            signer="$(echo "$certs" | sed -n 's/^.*certificate DN: //p' | head -n 1)"
            digest="$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"
            echo "| $(basename "$apk") | $(stat -c %s "$apk") | \`$(sha256sum "$apk" | cut -d' ' -f1)\` | $signer (\`${digest:0:16}…\`) |" >> "$GITHUB_STEP_SUMMARY"
          done 2>&1 | tee "$OUT/report-sign.txt"
          sha256sum build/app/outputs/flutter-apk/*.apk | tee -a "$OUT/report-apk.txt"

      # Every APK is an artifact of its own and is stored as it is, not inside
      # a zip, so that it can be downloaded straight onto a device. Such an
      # artifact is named after its file.
      - name: Upload app-arm64-v8a-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload app-armeabi-v7a-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload app-x86_64-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false
          if-no-files-found: error

      # --- temporary development aids ---------------------------------------
      - name: Carry APKs (dev aid)
        if: ${{ always() && contains(github.event.head_commit.message, '[carry-apk]') }}
        run: bash .github/scripts/dev_carry.sh apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Publish reports (dev aid)
        if: ${{ always() }}
        run: bash .github/scripts/dev_reports.sh

  emulator-smoke:
    name: Emulator smoke test
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # An APK is a zip file itself and has to arrive unopened.
      - uses: actions/download-artifact@v8
        with:
          name: app-release.apk
          path: apk
          skip-decompress: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?} kernel=$(uname -r) runner=${RUNNER_NAME:-?}" > "$RUNNER_TEMP/out/report-image-smoke.txt"
          ls -lR apk >> "$RUNNER_TEMP/out/report-image-smoke.txt" 2>&1 || true
          sha256sum apk/* >> "$RUNNER_TEMP/out/report-image-smoke.txt" 2>&1 || true

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/emulator_smoke.sh apk/app-release.apk smoke > "$OUT/report-smoke.txt" 2>&1; code=$?; cat "$OUT/report-smoke.txt"; exit $code

      - name: Upload emulator screenshots and logcat
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke
          path: smoke/
          if-no-files-found: warn

      - name: Publish reports (dev aid)
        if: ${{ always() }}
        run: |
          bash .github/scripts/dev_reports.sh
          tar -cf "$RUNNER_TEMP/smoke.tar" smoke || true
          bash .github/scripts/dev_carry.sh smoke "$RUNNER_TEMP/smoke.tar"
