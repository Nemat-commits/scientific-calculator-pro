name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get 2>&1 | tee "$OUT/report-pubget.txt"
        shell: bash -eo pipefail {0}

      - name: Generate Drift code
        if: ${{ !cancelled() }}
        run: |
          dart run build_runner build 2>&1 | tee "$OUT/report-buildrunner.txt"
          cp lib/data/local_db/app_database.g.dart "$OUT/report-app-database-g.txt"
        shell: bash -eo pipefail {0}

      - name: Static analysis
        if: ${{ !cancelled() }}
        run: flutter analyze 2>&1 | tee "$OUT/report-analyze.txt"
        shell: bash -eo pipefail {0}

      - name: Gate 1 - MathEngine (TC-01..TC-20), headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --plain-name "MathEngine" --reporter expanded 2>&1 | tee "$OUT/report-gate1.txt"
        shell: bash -eo pipefail {0}

      - name: Gate 2 - all 24 verification cases, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --reporter expanded 2>&1 | tee "$OUT/report-gate2.txt"
        shell: bash -eo pipefail {0}

      - name: Domain test-suite, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain --reporter expanded 2>&1 | tee "$OUT/report-domain.txt"
        shell: bash -eo pipefail {0}

      - name: Flutter test-suite
        if: ${{ !cancelled() }}
        run: flutter test --reporter expanded 2>&1 | tee "$OUT/report-flutter-test.txt"
        shell: bash -eo pipefail {0}

      - name: Render screenshots
        if: ${{ !cancelled() }}
        run: CALC_SCREENSHOTS=1 flutter test test/screenshots --reporter expanded 2>&1 | tee "$OUT/report-screenshots.txt"
        shell: bash -eo pipefail {0}

      # --- development aid: mirrors the step logs into check runs -----------
      - name: Publish reports
        if: ${{ always() }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          for f in "$OUT"/report-*.txt; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .txt)"
            tail -c 60000 "$f" > chunk.txt
            jq -n --arg name "$name" --arg sha "$GITHUB_SHA" --arg summary "run=$GITHUB_RUN_ID bytes=$(wc -c < "$f")" --rawfile text chunk.txt \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:$name, summary:$summary, text:$text}}' > payload.json
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input payload.json --jq '.id' || true
          done
          # screenshots: PNG -> base64 chunks of 60 kB
          if ls "$GITHUB_WORKSPACE"/build/screenshots/*.png >/dev/null 2>&1; then
            tar -C "$GITHUB_WORKSPACE/build/screenshots" -cf shots.tar .
            base64 -w0 shots.tar > shots.b64
            split -b 60000 -d -a 3 shots.b64 shot_
            total=$(ls shot_* | wc -l); i=0
            for f in shot_*; do
              jq -n --arg name "shots-$(printf '%03d' $i)" --arg sha "$GITHUB_SHA" --arg summary "chunk $i of $total sha256=$(sha256sum shots.tar | cut -d' ' -f1)" --rawfile text "$f" \
                '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:$name, summary:$summary, text:$text}}' > payload.json
              gh api "repos/$GITHUB_REPOSITORY/check-runs" --input payload.json --jq '.id' > /dev/null || true
              i=$((i+1))
            done
            echo "published $total screenshot chunk(s)"
          fi
