name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: write   # TEMPORARY (dev_carry.sh creates unreferenced blobs); back to `read` when finished
  checks: write     # TEMPORARY (dev_reports.sh)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get 2>&1 | tee "$OUT/report-pubget.txt"
        shell: bash -eo pipefail {0}

      - name: Generated Drift code is up to date
        if: ${{ !cancelled() }}
        run: |
          dart run build_runner build 2>&1 | tee "$OUT/report-buildrunner.txt"
          git diff --stat --exit-code -- lib/data/local_db/app_database.g.dart 2>&1 | tee -a "$OUT/report-buildrunner.txt"
        shell: bash -eo pipefail {0}

      - name: Static analysis
        if: ${{ !cancelled() }}
        run: flutter analyze 2>&1 | tee "$OUT/report-analyze.txt"
        shell: bash -eo pipefail {0}

      - name: Gate 1 - MathEngine (TC-01..TC-20), headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --plain-name "MathEngine" --reporter expanded 2>&1 | tee "$OUT/report-gate1.txt"
        shell: bash -eo pipefail {0}

      - name: Gate 2 - all 24 verification cases, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain/engine_verification_test.dart --reporter expanded 2>&1 | tee "$OUT/report-gate2.txt"
        shell: bash -eo pipefail {0}

      - name: Domain test-suite, headless Dart
        if: ${{ !cancelled() }}
        run: dart test test/domain --reporter expanded 2>&1 | tee "$OUT/report-domain.txt"
        shell: bash -eo pipefail {0}

      - name: Gate 3 - Flutter test-suite (notifier, isolate cancellation, widgets)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: flutter test --timeout 120s --reporter expanded 2>&1 | tee "$OUT/report-flutter-test.txt"
        shell: bash -eo pipefail {0}

      - name: Render screenshots
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: CALC_SCREENSHOTS=1 flutter test test/screenshots --timeout 90s --reporter expanded 2>&1 | tee "$OUT/report-screenshots.txt"
        shell: bash -eo pipefail {0}

      # --- temporary development aids ---------------------------------------
      - name: Publish reports (dev aid)
        if: ${{ always() }}
        run: |
          bash .github/scripts/dev_reports.sh
          cd "$RUNNER_TEMP"
          [ -d "$GITHUB_WORKSPACE/build/screenshots" ] && tar -C "$GITHUB_WORKSPACE/build/screenshots" -cf shots.tar . || true
          bash "$GITHUB_WORKSPACE/.github/scripts/dev_carry.sh" verify shots.tar "$GITHUB_WORKSPACE/lib/data/local_db/app_database.g.dart"

  build-android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release 2>&1 | tee "$OUT/report-apk.txt"
          ls -l build/app/outputs/flutter-apk/ | tee -a "$OUT/report-apk.txt"
          sha256sum build/app/outputs/flutter-apk/*.apk | tee -a "$OUT/report-apk.txt"
        shell: bash -eo pipefail {0}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scientific-calculator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish reports (dev aid)
        if: ${{ always() }}
        run: |
          bash .github/scripts/dev_reports.sh
          bash .github/scripts/dev_carry.sh apk build/app/outputs/flutter-apk/app-release.apk

  emulator-smoke:
    name: Emulator smoke test
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: scientific-calculator-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/out" && echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/emulator_smoke.sh apk/app-release.apk smoke 2>&1 | tee "$OUT/report-smoke.txt"

      - name: Publish reports (dev aid)
        if: ${{ always() }}
        run: |
          bash .github/scripts/dev_reports.sh
          tar -cf "$RUNNER_TEMP/smoke.tar" smoke || true
          bash .github/scripts/dev_carry.sh smoke "$RUNNER_TEMP/smoke.tar"
