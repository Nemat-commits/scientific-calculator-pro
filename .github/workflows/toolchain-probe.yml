# Temporary bootstrap probe: records the exact toolchain / dependency versions
# the project is built against. Replaced by the real CI pipeline.
name: toolchain-probe

on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/toolchain-probe.yml'
      - '.github/probe/**'
  workflow_dispatch:
    inputs:
      note:
        description: 'Free-form note'
        required: false
        default: ''

permissions:
  contents: read
  checks: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Collect toolchain facts
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          {
            echo "### flutter --version"; flutter --version
            echo "### dart --version"; dart --version
            echo "### java -version"; java -version
            echo "### env"; echo "ANDROID_HOME=$ANDROID_HOME"; echo "JAVA_HOME=$JAVA_HOME"
            echo "### android sdk"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
            echo "### event"; jq -c '{event: .inputs}' "$GITHUB_EVENT_PATH"
            echo "### runner"; uname -a; nproc; free -g | head -2
          } > "$OUT/versions.txt" 2>&1
          flutter doctor -v > "$OUT/doctor.txt" 2>&1
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Scaffold reference project and resolve dependencies
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP"
          flutter create --no-pub --platforms=android --org com.scientific.calculator \
            --project-name modern_scientific_calculator -a kotlin \
            --description "Production 120Hz Multi-Tabbed Scientific Calculator with 2D MathPrint Engine." \
            scaffold > "$OUT/create.txt" 2>&1
          # Authentic template files (text only).
          ( cd scaffold && find . -type f \
              ! -name '*.png' ! -name '*.jar' ! -name '*.ico' ! -path './.dart_tool/*' ! -path './.idea/*' \
              -print0 | sort -z | tar --null -czf "$OUT/scaffold.tgz" -T - )
          ( cd scaffold && find . -type f | sort > "$OUT/scaffold-files.txt" )
          cp "$GITHUB_WORKSPACE/.github/probe/pubspec.yaml" scaffold/pubspec.yaml
          ( cd scaffold && flutter pub get ) > "$OUT/pubget.txt" 2>&1
          echo "pub get exit: $?" >> "$OUT/pubget.txt"
          cp scaffold/pubspec.lock "$OUT/pubspec.lock" 2>/dev/null
          ( cd scaffold && flutter pub deps --style=compact ) > "$OUT/deps.txt" 2>&1
          jq -c '[.packages[] | {name, rootUri, languageVersion}]' scaffold/.dart_tool/package_config.json > "$OUT/package_config.min.json" 2>/dev/null

      - name: Trial Android release build of the bare scaffold
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/scaffold"
          START=$(date +%s)
          flutter build apk --release --target-platform android-arm64 > "$OUT/build-apk.txt" 2>&1
          RC=$?
          END=$(date +%s)
          {
            echo "exit=$RC seconds=$((END-START))"
            ls -la build/app/outputs/flutter-apk/ 2>&1
            echo "### tail of build log"; tail -n 60 "$OUT/build-apk.txt"
            echo "### generated plugin registrant"; cat android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java 2>/dev/null
            echo "### gradle wrapper"; cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null
            echo "### android dir after build"; find android -maxdepth 3 -type f | sort
          } > "$OUT/build-summary.txt" 2>&1
          rm -f "$OUT/build-apk.txt.full"; head -c 200000 "$OUT/build-apk.txt" > "$OUT/build-apk.head.txt"; rm -f "$OUT/build-apk.txt"

      - name: Publish probe output as check runs
        if: always()
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP"
          tar -czf probe.tgz -C "$OUT" .
          base64 -w0 probe.tgz > probe.b64
          SHA=$(sha256sum probe.tgz | cut -d' ' -f1)
          split -b 60000 -d -a 3 probe.b64 chunk_
          TOTAL=$(ls chunk_* | wc -l)
          i=0
          for f in chunk_*; do
            jq -n --arg name "probe-out-$(printf '%03d' $i)" --arg sha "$GITHUB_SHA" \
                  --arg summary "chunk $i of $TOTAL sha256=$SHA run=$GITHUB_RUN_ID" --rawfile text "$f" \
              '{name:$name, head_sha:$sha, status:"completed", conclusion:"neutral",
                output:{title:$name, summary:$summary, text:$text}}' > payload.json
            gh api "repos/$GITHUB_REPOSITORY/check-runs" --input payload.json --jq '.id'
            i=$((i+1))
          done
          echo "published $TOTAL chunk(s), sha256=$SHA"
